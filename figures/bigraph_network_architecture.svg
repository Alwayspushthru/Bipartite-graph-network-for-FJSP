<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f3a45"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6cb0"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #1f2933; }
      .subtitle { font: 400 18px Arial, Helvetica, sans-serif; fill: #52606d; }
      .section { font: 700 20px Arial, Helvetica, sans-serif; fill: #1f2933; }
      .label { font: 700 18px Arial, Helvetica, sans-serif; fill: #1f2933; }
      .small { font: 400 15px Arial, Helvetica, sans-serif; fill: #3e4c59; }
      .tiny { font: 400 13px Arial, Helvetica, sans-serif; fill: #52606d; }
      .math { font: 600 16px Arial, Helvetica, sans-serif; fill: #1f2933; }
      .box { rx: 8; ry: 8; stroke-width: 2; }
      .input { fill: #e8f4f8; stroke: #2f9eb3; }
      .embed { fill: #f0f7e8; stroke: #5b9b3e; }
      .layer { fill: #fff4d6; stroke: #d99a1e; }
      .proj { fill: #f4ecfb; stroke: #8b5fbf; }
      .global { fill: #ecfdf3; stroke: #2f855a; }
      .actor { fill: #eef2ff; stroke: #4c63b6; }
      .critic { fill: #fff0f0; stroke: #cf4f4f; }
      .mask { fill: #f2f4f7; stroke: #77808a; stroke-dasharray: 8 6; }
      .line { fill: none; stroke: #2f3a45; stroke-width: 2.2; marker-end: url(#arrow); }
      .lineBlue { fill: none; stroke: #2b6cb0; stroke-width: 2.2; marker-end: url(#arrowBlue); }
      .dash { fill: none; stroke: #77808a; stroke-width: 2; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .thin { fill: none; stroke: #5f6b76; stroke-width: 1.7; marker-end: url(#arrow); }
      .panel { fill: #fbfcfd; stroke: #d5dce3; stroke-width: 2; rx: 10; ry: 10; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1180"/>
  <text class="title" x="900" y="55" text-anchor="middle">BiGraphNetwork Architecture for Flexible Job Shop Scheduling</text>
  <text class="subtitle" x="900" y="88" text-anchor="middle">Operation-machine bipartite graph encoder with pair-wise attention bias, temporal GRU memory, and PPO actor-critic heads</text>

  <!-- Inputs -->
  <text class="section" x="95" y="145">State features</text>
  <rect class="box input" x="70" y="175" width="260" height="78"/>
  <text class="label" x="200" y="205" text-anchor="middle">Operation nodes</text>
  <text class="small" x="200" y="230" text-anchor="middle">X<tspan baseline-shift="super">O</tspan> in R<tspan baseline-shift="super">B x J x 8</tspan></text>

  <rect class="box input" x="70" y="305" width="260" height="78"/>
  <text class="label" x="200" y="335" text-anchor="middle">Machine nodes</text>
  <text class="small" x="200" y="360" text-anchor="middle">X<tspan baseline-shift="super">M</tspan> in R<tspan baseline-shift="super">B x M x 5</tspan></text>

  <rect class="box input" x="70" y="435" width="260" height="78"/>
  <text class="label" x="200" y="465" text-anchor="middle">Operation-machine pairs</text>
  <text class="small" x="200" y="490" text-anchor="middle">X<tspan baseline-shift="super">P</tspan> in R<tspan baseline-shift="super">B x J x M x 6</tspan></text>

  <rect class="box mask" x="70" y="565" width="260" height="78"/>
  <text class="label" x="200" y="595" text-anchor="middle">Dynamic pair mask</text>
  <text class="small" x="200" y="620" text-anchor="middle">invalid operation-machine pairs</text>

  <!-- Embeddings -->
  <text class="section" x="420" y="145">Feature embedding</text>
  <rect class="box embed" x="390" y="175" width="245" height="78"/>
  <text class="label" x="512" y="205" text-anchor="middle">Job MLP</text>
  <text class="small" x="512" y="230" text-anchor="middle">8 -> 128</text>

  <rect class="box embed" x="390" y="305" width="245" height="78"/>
  <text class="label" x="512" y="335" text-anchor="middle">Machine MLP</text>
  <text class="small" x="512" y="360" text-anchor="middle">5 -> 128</text>

  <rect class="box embed" x="390" y="435" width="245" height="78"/>
  <text class="label" x="512" y="465" text-anchor="middle">Pair MLP</text>
  <text class="small" x="512" y="490" text-anchor="middle">6 -> 128</text>

  <path class="line" d="M330 214 L390 214"/>
  <path class="line" d="M330 344 L390 344"/>
  <path class="line" d="M330 474 L390 474"/>
  <path class="dash" d="M330 604 C430 604 550 602 690 596"/>

  <!-- Encoder panel -->
  <rect class="panel" x="700" y="130" width="520" height="610"/>
  <text class="section" x="960" y="165" text-anchor="middle">Bipartite graph encoder, repeated L = 2 layers</text>

  <rect class="box layer" x="760" y="205" width="400" height="112"/>
  <text class="label" x="960" y="237" text-anchor="middle">O &#8592; M multi-head cross-attention</text>
  <text class="small" x="960" y="264" text-anchor="middle">Q from operations; K,V from machines</text>
  <text class="small" x="960" y="290" text-anchor="middle">score = QK<tspan baseline-shift="super">T</tspan>/sqrt(d<tspan baseline-shift="sub">h</tspan>) + w<tspan baseline-shift="sub">a</tspan>(h<tspan baseline-shift="sub">pair</tspan>)</text>

  <rect class="box layer" x="760" y="355" width="400" height="112"/>
  <text class="label" x="960" y="387" text-anchor="middle">M &#8592; O multi-head cross-attention</text>
  <text class="small" x="960" y="414" text-anchor="middle">transposed pair features and mask</text>
  <text class="small" x="960" y="440" text-anchor="middle">attention-weighted pair gate: 1 + tanh(W<tspan baseline-shift="sub">g</tspan> h<tspan baseline-shift="sub">pair</tspan>)</text>

  <rect class="box layer" x="760" y="505" width="400" height="112"/>
  <text class="label" x="960" y="537" text-anchor="middle">Pair update</text>
  <text class="small" x="960" y="564" text-anchor="middle">concat(h<tspan baseline-shift="sub">O</tspan>, h<tspan baseline-shift="sub">M</tspan>, h<tspan baseline-shift="sub">P</tspan>) -> Linear + tanh</text>
  <text class="small" x="960" y="590" text-anchor="middle">residual connection + LayerNorm</text>

  <path class="line" d="M635 214 C670 214 688 228 760 244"/>
  <path class="line" d="M635 344 C678 344 696 374 760 395"/>
  <path class="line" d="M635 474 C668 474 694 520 760 548"/>
  <path class="thin" d="M960 317 L960 355"/>
  <path class="thin" d="M960 467 L960 505"/>
  <path class="thin" d="M1160 561 C1195 561 1195 675 960 675 C730 675 730 260 760 260"/>
  <text class="tiny" x="1055" y="690" text-anchor="middle">layer stack</text>

  <rect class="box embed" x="805" y="650" width="310" height="62"/>
  <text class="label" x="960" y="676" text-anchor="middle">Encoded embeddings</text>
  <text class="small" x="960" y="699" text-anchor="middle">h<tspan baseline-shift="sub">O</tspan>, h<tspan baseline-shift="sub">M</tspan>, h<tspan baseline-shift="sub">P</tspan> all with d = 128</text>

  <!-- Projections -->
  <text class="section" x="1324" y="145">Policy/value feature paths</text>
  <rect class="box proj" x="1280" y="185" width="245" height="82"/>
  <text class="label" x="1402" y="216" text-anchor="middle">Local actor projections</text>
  <text class="small" x="1402" y="242" text-anchor="middle">O, M, P: 128 -> 32</text>

  <rect class="box global" x="1280" y="325" width="245" height="96"/>
  <text class="label" x="1402" y="357" text-anchor="middle">Global projections</text>
  <text class="small" x="1402" y="383" text-anchor="middle">O, M, P: 128 -> 16</text>
  <text class="small" x="1402" y="406" text-anchor="middle">masked mean pooling</text>

  <rect class="box global" x="1280" y="475" width="245" height="82"/>
  <text class="label" x="1402" y="506" text-anchor="middle">Graph summary</text>
  <text class="small" x="1402" y="532" text-anchor="middle">h<tspan baseline-shift="sub">graph</tspan> = [g<tspan baseline-shift="sub">O</tspan>, g<tspan baseline-shift="sub">M</tspan>, g<tspan baseline-shift="sub">P</tspan>] in R<tspan baseline-shift="super">48</tspan></text>

  <rect class="box global" x="1280" y="610" width="245" height="82"/>
  <text class="label" x="1402" y="641" text-anchor="middle">GRUCell memory</text>
  <text class="small" x="1402" y="667" text-anchor="middle">h<tspan baseline-shift="sub">hist</tspan>: 64, input h<tspan baseline-shift="sub">graph</tspan></text>

  <path class="line" d="M1115 681 C1190 681 1212 226 1280 226"/>
  <path class="line" d="M1115 681 C1190 681 1212 374 1280 374"/>
  <path class="line" d="M1402 421 L1402 475"/>
  <path class="line" d="M1402 557 L1402 610"/>

  <!-- Actor candidate construction -->
  <rect class="box actor" x="560" y="825" width="510" height="132"/>
  <text class="label" x="815" y="858" text-anchor="middle">Candidate pair feature construction</text>
  <text class="small" x="815" y="887" text-anchor="middle">for each valid operation-machine pair (O<tspan baseline-shift="sub">j</tspan>, M<tspan baseline-shift="sub">k</tspan>)</text>
  <text class="math" x="815" y="918" text-anchor="middle">z<tspan baseline-shift="sub">jk</tspan> = [a<tspan baseline-shift="sub">O,j</tspan>, a<tspan baseline-shift="sub">M,k</tspan>, g<tspan baseline-shift="sub">O</tspan>, g<tspan baseline-shift="sub">M</tspan>, a<tspan baseline-shift="sub">P,jk</tspan>, h<tspan baseline-shift="sub">hist</tspan>] in R<tspan baseline-shift="super">160</tspan></text>
  <text class="tiny" x="815" y="944" text-anchor="middle">32 + 32 + 16 + 16 + 32 + 64</text>

  <rect class="box actor" x="1185" y="825" width="250" height="132"/>
  <text class="label" x="1310" y="858" text-anchor="middle">Actor MLP</text>
  <text class="small" x="1310" y="887" text-anchor="middle">160 -> 64 -> 64 -> 1</text>
  <text class="small" x="1310" y="918" text-anchor="middle">masked logits + softmax</text>
  <text class="math" x="1310" y="945" text-anchor="middle">policy pi(a | s)</text>

  <rect class="box critic" x="1185" y="1000" width="250" height="98"/>
  <text class="label" x="1310" y="1033" text-anchor="middle">Critic MLP</text>
  <text class="small" x="1310" y="1061" text-anchor="middle">[h<tspan baseline-shift="sub">graph</tspan>, h<tspan baseline-shift="sub">hist</tspan>] in R<tspan baseline-shift="super">112</tspan></text>
  <text class="math" x="1310" y="1088" text-anchor="middle">state value V(s)</text>

  <path class="lineBlue" d="M1402 267 C1402 770 1058 820 970 825"/>
  <path class="lineBlue" d="M1402 692 C1402 760 1030 805 905 825"/>
  <path class="lineBlue" d="M1280 516 C1148 545 968 744 880 825"/>
  <path class="lineBlue" d="M1070 891 L1185 891"/>
  <path class="dash" d="M330 604 C650 765 980 845 1185 917"/>
  <path class="line" d="M1402 557 C1518 630 1510 1024 1435 1048"/>
  <path class="line" d="M1402 692 C1534 742 1515 1016 1435 1048"/>

  <!-- Output and training loop -->
  <rect class="box input" x="1515" y="825" width="220" height="132"/>
  <text class="label" x="1625" y="858" text-anchor="middle">Scheduling action</text>
  <text class="small" x="1625" y="887" text-anchor="middle">select next pair</text>
  <text class="math" x="1625" y="918" text-anchor="middle">a = (operation, machine)</text>
  <text class="small" x="1625" y="945" text-anchor="middle">sample or argmax from pi</text>

  <rect class="box critic" x="1515" y="1000" width="220" height="98"/>
  <text class="label" x="1625" y="1033" text-anchor="middle">PPO training</text>
  <text class="small" x="1625" y="1061" text-anchor="middle">policy loss + value loss</text>
  <text class="small" x="1625" y="1088" text-anchor="middle">entropy regularization</text>

  <path class="line" d="M1435 891 L1515 891"/>
  <path class="line" d="M1435 1049 L1515 1049"/>
  <path class="thin" d="M1625 957 L1625 1000"/>

  <!-- Legend -->
  <rect class="panel" x="70" y="840" width="390" height="242"/>
  <text class="section" x="95" y="875">Notation</text>
  <text class="small" x="95" y="910">O: operation node; M: machine node; P: pair/edge feature</text>
  <text class="small" x="95" y="940">J: number of schedulable operations; M: number of machines</text>
  <text class="small" x="95" y="970">d = 128; actor local dim = 32; global dim = 16</text>
  <text class="small" x="95" y="1000">The mask removes infeasible or already invalid pairs</text>
  <text class="small" x="95" y="1030">Temporal memory is reset for finished environments</text>
  <text class="tiny" x="95" y="1062">Implementation source: model/BiGraphNetwork.py</text>
</svg>
